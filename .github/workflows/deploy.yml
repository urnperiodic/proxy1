name: Build and Deploy Scramjet

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages and branch push
permissions:
  contents: write
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository along with its submodules
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2. Install Rust toolchain
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # 3. Setup Rewriter Toolchain (wasm-bindgen, binaryen, wasm-snip)
      - name: Setup Rewriter Toolchain
        uses: ./.github/actions/setup-rewriter-toolchain
        with:
          wasm-bindgen-version: "0.2.105"
          rewriter-path: packages/core/rewriter
          github-token: ${{ github.token }}

      # 4. Setup pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # 5. Set up Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      # 6. Install Scramjet package dependencies
      - name: Install Dependencies
        run: pnpm install

      # 7. Compile the WebAssembly Rewriter Core
      - name: Build WASM Rewriter
        run: |
          cd packages/core
          pnpm rewriter:build

      # 8. Build Scramjet Packages and Demo Frontend
      - name: Build Project
        run: pnpm build

      # 9. Upload artifact for modern GitHub Pages
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: packages/demo/dist

      # 10. Deploy to modern GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      # 11. Backup Deploy to gh-pages branch (supports classic branch-based Pages)
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: packages/demo/dist
